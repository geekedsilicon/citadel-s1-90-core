# ============================================================================
# VAELIX | PROJECT CITADEL
# ============================================================================
# PROJECT INFORMATION: S1-90 SILICON PROTOTYPE
# TARGET: TINY TAPEOUT 06 (IHP 130nm SG13G2)
# ============================================================================

project:
  title:        "Project Citadel: S1-90 Core"
  author:       "Vaelix Systems R&D"
  discord:      "" 
  description:  "Hardened Verilog logic for Vaelix Sentinel authorization."
  language:     "Verilog"
  clock_hz:     25000000  # Optimized Stability Target: 25MHz

  # Scaling: Single tile is sufficient for the S1-90 Sentinel logic.
  tiles: "1x1"

  # Module & Repo Identity (Must match GitHub exactly)
  top_module:   "tt_um_vaelix_sentinel"
  repo:         "citadel-s1-90-core"

  # Source Manifest: Order is critical for synthesis.
  source_files:
    - "tt_um_vaelix_sentinel.v"
    - "cells.v"

# PINOUT DEFINITION: THE SENTINEL INTERFACE
# Inputs (ui): Authorization Key (0xB6)
# Outputs (uo): 7-Segment Display (Active LOW / Common Anode)
# Bidirectional (uio): Status Array & Telemetry
pinout:
  # UI[7:0] - The Authorization Key (DIP Switches)
  ui[0]: "KEY_BIT0"
  ui[1]: "KEY_BIT1"
  ui[2]: "KEY_BIT2"
  ui[3]: "KEY_BIT3"
  ui[4]: "KEY_BIT4"
  ui[5]: "KEY_BIT5"
  ui[6]: "KEY_BIT6"
  ui[7]: "KEY_BIT7"

  # UO[7:0] - 7-Segment Display Telemetry
  uo[0]: "SEG_A"
  uo[1]: "SEG_B"
  uo[2]: "SEG_C"
  uo[3]: "SEG_D"
  uo[4]: "SEG_E"
  uo[5]: "SEG_F"
  uo[6]: "SEG_G"
  uo[7]: "SEG_DP"

  # UIO[7:0] - Vaelix "Glow" Status Array
  uio[0]: "STATUS_0"
  uio[1]: "STATUS_1"
  uio[2]: "STATUS_2"
  uio[3]: "STATUS_3"
  uio[4]: "STATUS_4"
  uio[5]: "STATUS_5"
  uio[6]: "STATUS_6"
  uio[7]: "STATUS_7"

# Operational Integrity Check
yaml_version: 6
